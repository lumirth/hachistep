[package]
name = "hs-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hs-desktop"
path = "src/main.rs"

[dependencies]
hs-runtime = { path = "../hs-runtime" }
gpui-kit = "=0.7.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
png = "0.18"
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
