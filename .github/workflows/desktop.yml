name: Desktop
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path desktop/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --manifest-path desktop/Cargo.toml -p hs-desktop --release --locked
      - run: python desktop/package.py --out out/package
      - uses: actions/upload-artifact@v4
        with:
          name: hachistep-${{ matrix.os }}
          path: ${{ runner.os == 'macOS' && 'out/package/hachistep-macos.zip' || 'out/package' }}
