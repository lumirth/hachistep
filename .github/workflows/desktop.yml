name: Desktop
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: 0
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libudev-dev libvulkan1 mesa-vulkan-drivers xvfb
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --manifest-path desktop/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --release --locked -p hs-cli
      - run: cargo build --manifest-path desktop/Cargo.toml -p hs-desktop --release --locked
      - run: python desktop/package.py --out out/package
      - name: Verify Linux startup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out/package/hachistep/hachistep-cli --version
          out/package/hachistep/hachistep --help
          set +e
          xvfb-run -a timeout 10s out/package/hachistep/hachistep > out/startup.log 2>&1
          result=$?
          set -e
          cat out/startup.log
          test "$result" = 124
      - uses: actions/upload-artifact@v4
        with:
          name: hachistep-${{ matrix.os }}
          path: |
            out/package/*.zip
            out/package/*.tar.gz
          if-no-files-found: error
  wasi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p hs-cli --target wasm32-wasip1
      - name: Package WASI CLI
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          mkdir -p out/package/hachistep
          cp target/wasm32-wasip1/release/hachistep.wasm LICENSE out/package/hachistep/
          tar -czf "out/package/hachistep-$version-wasm32-wasip1.tar.gz" -C out/package hachistep
      - uses: actions/upload-artifact@v4
        with:
          name: hachistep-wasi
          path: out/package/*.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, wasi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hachistep-*
          merge-multiple: true
          path: out/release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$TAG" = "v$version"
          (cd out/release && sha256sum *.zip *.tar.gz > SHA256SUMS)
          gh release create "$TAG" out/release/* --verify-tag --title "hachistep $version" --notes-file docs/release.md --prerelease
