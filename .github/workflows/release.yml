name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Review build platform
        type: choice
        options: [macos-latest, windows-latest, ubuntu-24.04, all]
        default: macos-latest
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: 0
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (inputs.platform == '' || inputs.platform == 'all') && fromJSON('["macos-latest", "windows-latest", "ubuntu-24.04"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Prepare pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup toolchain uninstall stable
      - if: runner.os == 'Linux'
        run: bash .github/install-linux.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
          workspaces: desktop
      - uses: ./.github/actions/package
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: hachistep-*
          merge-multiple: true
          path: out/release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          revision=$(git rev-parse HEAD)
          run=$(gh run list --workflow ci.yml --branch main --event push --commit "$revision" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          test -n "$run"
          gh run watch "$run" --exit-status --interval 10
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$TAG" = "v$version"
          (cd out/release && sha256sum -- *.dmg *.zip *.tar.gz > SHA256SUMS)
          gh release create "$TAG" out/release/* --verify-tag --title "hachistep $version" --notes-file docs/release.md --latest
