[workspace]
members = ["crates/hs-runtime", "crates/hs-desktop"]
resolver = "2"

[patch.crates-io]
accesskit_macos = { path = "patches/accesskit_macos" }

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
borsh = { version = "1.8.1", default-features = false, features = ["std", "derive"] }
sha2 = { version = "0.10.9", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.dev]
overflow-checks = true
