[package]
name = "accesskit_macos"
version = "0.26.3"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AccessKit/accesskit"

[dependencies]
accesskit = "0.24.1"
accesskit_consumer = "0.38.0"
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher"] }
objc2 = "0.5.1"
objc2-app-kit = { version = "0.2.0", features = [
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSAccessibilityElement",
    "NSAccessibilityProtocols",
    "NSColor",
    "NSResponder",
    "NSText",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.2.0", features = ["NSArray", "NSDictionary", "NSValue", "NSThread"] }
